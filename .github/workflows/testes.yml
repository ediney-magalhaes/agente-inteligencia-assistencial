name: Testes
on:
  push:
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Rodar os testes
        run: python -m pytest